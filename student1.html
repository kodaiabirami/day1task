<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="student.css">
</head>
<body>
    <div class="container">
        <h1>Student Registration Form</h1>
        <p class="subtitle">please fill in your details </p>
        <form>
            <div class="form-group"><label>Full Name</label><input type="text" placeholder="Enter your full name"> </div>
            <div class="form-group"><label>Email</label><input type="email" placeholder="Enter your email"> </div>
            <div class="form-group"><label>Phone number</label><input type="number" placeholder="Enter your phone number"> </div>
            <div class="form-group"><label>Date of birth</label><input type="number" placeholder="Enter your "> </div>
            <div class="form-group"><label>Gender<input type="radio" name="Gender">male</label>
                                    <label>Gender<input type="radio" name="Gender">Female</label>
        <div class="form-group"><label>Course </label>
            <select>
                <option>Select your Course</option>
                <option>MERN Stack Development</option>
                <option>Java Full Stack</option>
                <option>Python Full Stack</option>
                <option>Web Development</option>
            </select>
        </div>
        <div class="skills"><label><input type="checkbox">HTML</label></div>
                             <label><input type="checkbox">CSS</label>
                             <label><input type="checkbox">Java Script</label> 
                             <label><input type="checkbox">React</label> </div>
           <div class="form-group"><label>Address</label> <textarea placeholder="Enter your address"></textarea></div> 
           <div class="form-group"><label>Upload your photo</label><input type="file"></div> 
           <div class="terms"><input type="checkbox"><span>I agree to the conditions.</span></div>
           <div class="buttons"><button type="submit">Register</button><button type="reset">Reset</button></div>                 
        </form>
    </div>
</body>    
</html>
